<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form class="form-horizontal" th:action="@{/save-product}" method="post" enctype="multipart/form-data"  th:object = "${product}">
                <fieldset>
                    <!-- Form Name -->
                    <legend class="text-center mb-4">ADD PRODUCT</legend>

                    <!-- Product Name -->
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label" for="product_name">PRODUCT NAME</label>
                        <div class="col-md-8">
                            <input id="product_name" th:field="*{name}" name="product_name" class="form-control" required="" type="text">
                        </div>
                    </div>

                    <!-- Product Category -->
                    <div class="form-group row" >
                        <label class="col-md-4 col-form-label" for="categories">PRODUCT CATEGORY</label>
                        <div class="col-md-8">
                            <select id="categories" th:field = "*{category}" name="categories" class="form-control">
                                    <option th:value="null">-SELECT-</option>
                                <option th:each = "category : ${categories}"
                                th:value = "${category.id}"
                                th:text = "${category.name}"
                                ></option>
                            </select>
                        </div>
                    </div>

                    <!-- Product Description -->
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label" for="description">PRODUCT DESCRIPTION</label>
                        <div class="col-md-8">
                            <input id="description" th:field="*{description}" name="description" class="form-control" required="" type="text">
                        </div>
                    </div>

                    <!-- Available Quantity -->
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label" for="available_quantity">AVAILABLE QUANTITY</label>
                        <div class="col-md-8">
                            <input id="available_quantity" th:field="*{currentQuantity}" name="available_quantity" class="form-control" required="" type="text">
                        </div>
                    </div>

                    <!-- Price -->
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label" for="price">Price</label>
                        <div class="col-md-8">
                            <input id="price" name="price" th:field="*{costPrice}" class="form-control" required="" type="text">
                        </div>
                    </div>

                    <!-- Image Product -->
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label" for="imageProduct">Image Product</label>
                        <div class="col-md-8">
                            <input id="imageProduct" name="imageProduct" class="form-control-file" type="file">
                        </div>
                    </div>

                    <!-- Save Button -->
                    <div class="form-group row">
                        <div class="col-md-8 offset-md-4">
                            <button type="submit" class="btn btn-info">Save</button>
                        </div>
                    </div>

                </fieldset>
            </form>
        </div>
    </div>
</div>

</body>

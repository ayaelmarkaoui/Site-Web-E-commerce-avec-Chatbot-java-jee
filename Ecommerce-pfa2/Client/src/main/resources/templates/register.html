<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/fonts1/icomoon/style.css}">
    <link rel="stylesheet" th:href="@{/css1/owl.carousel.min.css}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css1/bootstrap.min.css}">
    <!-- Style -->
    <link rel="stylesheet" th:href="@{/css1/style.css}">

    <title>Register</title>
</head>
<body class="bg-light">

<div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image:  url('/img/bg_1.jpg');"></div>


    <div class="contents order-2 order-md-1" >

        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-md-7">
                    <div class="mb-4">
                        <h3>Sign In</h3>
                    </div>
                    <div th:if="${errors}" class="text-center alert-danger">
                        <p th:text="${errors}"></p>
                    </div>
                    <div th:if="${username}" class="text-center alert-warning">
                        <p th:text="${username}"></p>
                    </div>
                    <div th:if="${success}" class="text-center alert-success">
                        <p th:text="${success}"></p>
                    </div>
                    <div th:if="${password}" class="text-center alert-warning">
                        <p th:text="${password}"></p>
                    </div>
                    <form th:action="@{/do-register}" method="post" th:object="${customerDto}" >
                        <div class="form-group first">
                            <label for="firstname">First Name</label>
                            <input type="text" th:field="*{firstname}" class="form-control"  id="firstname">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('firstname')}"
                        th:errors="*{firstname}">
                        </div>
                        <div class="form-group first">
                            <label for="lastname">Last Name</label>
                            <input type="text" th:field="*{lastname}" class="form-control"  id="lastname">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('lastname')}"
                             th:errors="*{lastname}">
                        </div>
                        <div class="form-group first">
                            <label for="username">UserName</label>
                            <input type="email" th:field="*{username}" class="form-control"  id="username">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}">
                        </div>
                        <div class="form-group first">
                            <label for="country">Country</label>
                            <input type="text" th:field="*{country}" class="form-control" id="country">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('country')}"
                             th:errors="*{country}">
                        </div>
                        <div class="form-group first">
                            <label for="password">Password</label>
                            <input type="password" th:field="*{password}" class="form-control"  id="password">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">
                        </div>
                        <div class="form-group last">
                            <label for="repeatPassword">Confirm Password</label>
                            <input type="password" th:field="*{repeatPassword}" class="form-control"  id="repeatPassword">
                        </div>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('repeatPassword')}"
                             th:errors="*{repeatPassword}">
                        </div>




                        <div class="input-form">
                            <p> Do you Already Have An Account? <a th:href="@{/login}">Sign in Now</a></p>
                        </div>
                        <input type="submit" value="Log In" class="btn btn-block btn-primary">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    window.embeddedChatbotConfig = {
        chatbotId: "vBI4xpK__9vScQ5-fHWRC",
        domain: "www.chatbase.co"
    }
</script>
<script
        src="https://www.chatbase.co/embed.min.js"
        chatbotId="vBI4xpK__9vScQ5-fHWRC"
        domain="www.chatbase.co"
        defer>
</script>
<script th:src="@{js1/jquery-3.3.1.min.js}"></script>
<script th:src="@{js1/popper.min.js}"></script>
<script th:src="@{js1/bootstrap.min.js}"></script>
<script th:src="@{js1/main.js}"></script>
</body>
</html>
